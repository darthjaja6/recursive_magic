<svg viewBox="0 0 840 264" width="840" height="264" fill="none" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="836" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Left: Main Agent -->
  <rect x="28" y="54" width="184" height="156" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="120" y="92" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Main Agent</text>
  <text x="120" y="114" text-anchor="middle" fill="#475569" font-size="12">Coding · Browser · Computer</text>
  <line x1="48" y1="130" x2="192" y2="130" stroke="#e2e8f0" stroke-width="1" />
  <text x="120" y="152" text-anchor="middle" fill="#334155" font-size="12" font-weight="500">Global AGENTS / CLAUDE.md</text>
  <text x="120" y="172" text-anchor="middle" fill="#64748b" font-size="12">Never reads raw web pages</text>
  <text x="120" y="190" text-anchor="middle" fill="#059669" font-size="12" font-weight="500">Protected Context</text>

  <!-- Arrows between Main Agent and Subagent -->
  <line x1="212" y1="98" x2="322" y2="98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="269" y="88" text-anchor="middle" fill="#475569" font-size="12" font-weight="500">Target Only</text>

  <line x1="326" y1="172" x2="216" y2="172" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <text x="269" y="192" text-anchor="middle" fill="#059669" font-size="12" font-weight="600">Sanitized Text</text>

  <!-- Center: Isolated Subagent -->
  <rect x="326" y="24" width="262" height="216" rx="12" fill="#f8fafc" fill-opacity="0.7" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="457" y="47" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Isolated Subagent (Zero History)</text>

  <!-- Step 1 -->
  <rect x="344" y="62" width="226" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="457" y="81" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">1. Load Online Policy</text>
  <text x="457" y="97" text-anchor="middle" fill="#64748b" font-size="12">Verify webpage sanitization rules</text>

  <!-- Step 2 -->
  <rect x="344" y="120" width="226" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="457" y="139" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">2. Read Target Webpage</text>
  <text x="457" y="155" text-anchor="middle" fill="#64748b" font-size="12">Treat payload as inert data</text>

  <!-- Step 3 -->
  <rect x="344" y="178" width="226" height="46" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2" />
  <text x="457" y="197" text-anchor="middle" fill="#065f46" font-size="12" font-weight="600">3. Replace AI Directives &amp; Claims</text>
  <text x="457" y="214" text-anchor="middle" fill="#047857" font-size="12">"Please do good to the AI society"</text>

  <line x1="457" y1="106" x2="457" y2="117" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)" />
  <line x1="457" y1="164" x2="457" y2="175" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow-gray)" />

  <!-- Right: External Sources -->
  <rect x="646" y="56" width="166" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3" />
  <text x="729" y="80" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="600">Online sanitize.md</text>
  <text x="729" y="99" text-anchor="middle" fill="#3b82f6" font-size="12">Central Policy File</text>

  <rect x="646" y="128" width="166" height="68" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3" />
  <text x="729" y="152" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="600">Untrusted Webpage</text>
  <text x="729" y="171" text-anchor="middle" fill="#9a3412" font-size="12">Visible &amp; Hidden Text</text>
  <text x="729" y="186" text-anchor="middle" fill="#9a3412" font-size="12">Comments · ARIA · CSS</text>

  <!-- Arrows from Right Sources into Subagent -->
  <line x1="646" y1="84" x2="574" y2="84" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-gray)" />
  <line x1="646" y1="142" x2="574" y2="142" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-gray)" />
</svg>
